name: Deploy Streamlit App to Heroku

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Checks (Tests/Linting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Add your pytest logic here when you add testing
      # - name: Run tests
      #   run: |
      #     pip install pytest
      #     pytest

  deploy:
    name: Deploy Container to Heroku
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build, Push and Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "your-heroku-app-name" # Replace with your actual Heroku application name
          heroku_email: "${{secrets.HEROKU_EMAIL}}"
          usedocker: true # Tells Heroku to use the Dockerfile specified in heroku.yml
