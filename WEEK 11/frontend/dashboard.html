<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WearSync Portal</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="opacity: 0; transition: opacity 0.5s ease;">
    <nav class="dashboard-nav glass-panel" style="border-radius: 0; border-top: none; border-left: none; border-right: none;">
        <div class="brand">WearSync</div>
        <div class="nav-actions">
            <button class="toggle-dark-mode" id="theme-toggle" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn btn-outline btn-small" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar Profile -->
        <aside>
            <div class="glass-panel profile-card fade-in">
                <div class="profile-avatar" id="avatar-initial">U</div>
                <h2 id="profile-name">Loading...</h2>
                <p id="profile-email" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1rem;">...</p>
                
                <div class="profile-details">
                    <div class="detail-item">
                        <span class="detail-label">Age</span>
                        <span class="detail-value" id="profile-age">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Gender</span>
                        <span class="detail-value" id="profile-gender">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value" id="profile-phone">-</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main fade-in" style="animation-delay: 0.1s;">
            
            <div id="alert-box" class="alert"></div>

            <!-- Add Data Section -->
            <div class="glass-panel">
                <h3 style="margin-bottom: 1rem;"><i class="fas fa-plus-circle"></i> Sync New Data</h3>
                <form id="wearable-form">
                    <div class="metrics-grid">
                        <div class="form-group">
                            <label for="heartRate">Heart Rate (bpm)</label>
                            <input type="number" id="heartRate" class="form-control" required min="30" max="220" placeholder="e.g. 72">
                        </div>
                        <div class="form-group">
                            <label for="steps">Steps</label>
                            <input type="number" id="steps" class="form-control" required min="0" placeholder="e.g. 8500">
                        </div>
                        <div class="form-group">
                            <label for="sleep">Sleep (Hours)</label>
                            <input type="number" id="sleep" class="form-control" required min="0" max="24" step="0.1" placeholder="e.g. 7.5">
                        </div>
                        <div class="form-group">
                            <label for="calories">Calories</label>
                            <input type="number" id="calories" class="form-control" required min="0" placeholder="e.g. 2100">
                        </div>
                        <div class="form-group">
                            <label for="stressLevel">Stress Level (1-100)</label>
                            <input type="number" id="stressLevel" class="form-control" required min="1" max="100" placeholder="e.g. 35">
                        </div>
                    </div>
                    <button type="submit" class="btn" id="sync-btn" style="margin-top: 1rem;">
                        <i class="fas fa-sync"></i> Sync Data
                    </button>
                </form>
            </div>

            <!-- History Section -->
            <div class="glass-panel">
                <h3 style="margin-bottom: 1rem;"><i class="fas fa-history"></i> Recent History</h3>
                <div class="history-table-container">
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>Date & Time</th>
                                <th>Heart Rate</th>
                                <th>Steps</th>
                                <th>Sleep</th>
                                <th>Calories</th>
                                <th>Stress</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- Data populated by JS -->
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
